[project]
name = "ezmsg-simbiophys"
description = "Signal simulation and synthesis for ezmsg"
authors = [
  { name = "Chadwick Boulay", email = "chadwick.boulay@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "array-api-compat>=1.11.0",
  # 3.10.0b3 for AxisArray.stream_dim, which every producer here declares, and
  # CoordinateAxis.fingerprint, which they prime so downstream consumers do
  # not each recompute it.
  "ezmsg>=3.10.0b3",
  "ezmsg-baseproc>=1.12.0",  # axis-aware default state hash + hash witness
  "ezmsg-sigproc>=2.23.0",
  "ezmsg-event>=0.9.0",
  "numba>=0.59.0",
  "numpy>=1.26.0",
  "sparse>=0.17.0",
]


[project.entry-points."ezmsg.components"]
"simbiophys.BaselineDriftUnit" = "ezmsg.simbiophys.baseline_drift:BaselineDriftUnit"
"simbiophys.CosineEncoderUnit" = "ezmsg.simbiophys.cosine_encoder:CosineEncoderUnit"
"simbiophys.DNSSLFPUnit" = "ezmsg.simbiophys.dnss.lfp:DNSSLFPUnit"
"simbiophys.DNSSSpikeUnit" = "ezmsg.simbiophys.dnss.spike:DNSSSpikeUnit"
"simbiophys.DNSSSynth" = "ezmsg.simbiophys.dnss.synth:DNSSSynth"
"simbiophys.DynamicColoredNoiseUnit" = "ezmsg.simbiophys.dynamic_colored_noise:DynamicColoredNoiseUnit"
"simbiophys.EEGSynth" = "ezmsg.simbiophys.eeg:EEGSynth"
"simbiophys.LineNoiseUnit" = "ezmsg.simbiophys.line_noise:LineNoiseUnit"
"simbiophys.PinkNoise" = "ezmsg.simbiophys.noise:PinkNoise"
"simbiophys.SinGenerator" = "ezmsg.simbiophys.oscillator:SinGenerator"
"simbiophys.SpiralGenerator" = "ezmsg.simbiophys.oscillator:SpiralGenerator"
"simbiophys.Velocity2LFP" = "ezmsg.simbiophys.system.velocity2lfp:Velocity2LFP"
"simbiophys.Velocity2Spike" = "ezmsg.simbiophys.system.velocity2spike:Velocity2Spike"
"simbiophys.VelocityEncoder" = "ezmsg.simbiophys.system.velocity2ecephys:VelocityEncoder"
"simbiophys.WhiteNoise" = "ezmsg.simbiophys.noise:WhiteNoise"


[dependency-groups]
dev = [
  "pre-commit>=4.0.0",
  {include-group = "lint"},
  {include-group = "test"},
  "typer>=0.20.0",
  "scipy-stubs>=1.15.3.0",
  "ezmsg-peripheraldevice>=0.3.0",
  "ezmsg-lsl>=1.6.0",
]
lint = [
  "ruff",
]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "mlx>=0.18.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
docs = [
  "sphinx>=8.0",
  "pydata-sphinx-theme",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "myst-parser",
]

# Uncomment if your package provides CLI commands
# [project.scripts]
# ezmsg-simbiophys = "ezmsg.simbiophys.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ezmsg/simbiophys/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmsg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
# Exclude auto-generated files
exclude = ["*/__version__.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["ezmsg.simbiophys"]
known-third-party = ["ezmsg", "ezmsg.sigproc", "ezmsg.baseproc", "ezmsg.event"]

[tool.uv.sources]
#ezmsg = { path = "../ezmsg", editable = true }
